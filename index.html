        <input id="pmsg-sender" type="text" placeholder="Your Service No, Rank & Name (ඔබේ නම සහ අංකය)" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:border-amber-500 outline-none" />

  <!-- PWA INSTALL INSTRUCTION MODAL -->
  <div id="install-guide-modal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4" onclick="if(event.target===this) this.classList.add('hidden')">

        <h3 class="text-sm font-bold text-white" id="install-modal-heading">Install App on Your Phone</h3>
        <button onclick="document.getElementById('install-guide-modal').classList.add('hidden')" class="text-slate-400 hover:text-white">✕</button>
      </div>
      <p class="text-slate-300 leading-relaxed" id="install-modal-text"></p>
    </div>

  <script>
    // =========================================================================
    // DEFAULT ICONS & IMAGE OPTIMIZER
    // =========================================================================
    const DEFAULT_APP_ICON = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%230284c7'/%3E%3Cpath d='M280 80L120 290h130l-30 142 172-212H262l18-140z' fill='%23ffffff'/%3E%3C/svg%3E";
    const DEFAULT_AVATAR = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231e293b'/%3E%3Ccircle cx='50' cy='38' r='18' fill='%2338bdf8'/%3E%3Cpath d='M20 88c0-17 13-30 30-30s30 13 30 30' fill='%2338bdf8'/%3E%3C/svg%3E";

    function compressImageFile(file, maxSize, callback) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          let w = img.width;
          let h = img.height;
          if (w > h) {
            if (w > maxSize) { h = Math.round((h * maxSize) / w); w = maxSize; }
          } else {
            if (h > maxSize) { w = Math.round((w * maxSize) / h); h = maxSize; }
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          callback(canvas.toDataURL("image/png", 0.88));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // =========================================================================
    // PWA DYNAMIC MANIFEST & ICON UPDATER
    // =========================================================================
    let manifestBlobUrl = null;
    function updatePwaIconsAndManifest() {
      const iconSrc = appData.appIcon || DEFAULT_APP_ICON;
      const headerImg = document.getElementById("header-app-icon-img");
      if (headerImg) headerImg.src = iconSrc;

      document.getElementById("dynamic-favicon").href = iconSrc;
      document.getElementById("dynamic-apple-icon").href = iconSrc;

      if (manifestBlobUrl) URL.revokeObjectURL(manifestBlobUrl);
      const manifest = {
        name: appData.siteTitle || "Physical Training and Fitness System",
        short_name: "PT Fitness",
        start_url: window.location.href.split("#")[0].split("?")[0],
        display: "standalone",
        background_color: "#090d16",
        theme_color: "#090d16",
        icons: [
          { src: iconSrc, sizes: "192x192", type: "image/png" },
          { src: iconSrc, sizes: "512x512", type: "image/png" }
        ]
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
      manifestBlobUrl = URL.createObjectURL(blob);
      let link = document.querySelector("link[rel='manifest']");
      if (!link) {
        link = document.createElement("link");
        link.rel = "manifest";
        document.head.appendChild(link);
      }
      link.href = manifestBlobUrl;
    }

    let deferredInstallPrompt = null;
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
    });

    function triggerInstallApp() {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        deferredInstallPrompt.userChoice.then(() => { deferredInstallPrompt = null; });
      } else {
        document.getElementById("install-guide-modal").classList.remove("hidden");
      }
    }

    function shareSystemLink() {
      const cleanUrl = window.location.href.split("#")[0].split("?")[0];
      const title = appData.siteTitle;
      if (navigator.share) {
        navigator.share({ title, text: `${title} - Physical Fitness & PFT System`, url: cleanUrl }).catch(() => {});
      } else {
        navigator.clipboard.writeText(cleanUrl).then(() => {
          alert(currentLang === "si" ? "ලින්ක් එක Copy විය! WhatsApp හරහා යවන්න: " + cleanUrl : "Link copied! Share via WhatsApp: " + cleanUrl);
        });
      }
    }

    // SECRET 5-TAP LOGO ACCESS & SECURITY LOCKOUT
    // =========================================================================

    let logoTapTimer = null;
    function handleLogoTap() {
      logoTapCount++;
      clearTimeout(logoTapTimer);
      if (logoTapCount >= 5) {
        logoTapCount = 0;
        currentView = "admin";
        refreshUI();
      } else {
        logoTapTimer = setTimeout(() => { logoTapCount = 0; }, 1500);
      }
    }

    // =========================================================================
    // BILINGUAL DICTIONARY (ENGLISH & SINHALA)
    // =========================================================================
    let currentLang = localStorage.getItem("pt_lang") || "en";

    const UI_TEXT = {
      en: {

      },
      si: {
        langBtn: "English",
        creatorBtn: "නිර්මාතෘ",
        installBtn: "ඇප් එක ගන්න",
        shareBtn: "ලින්ක් එක යවන්න",

        selectSub: "අදාළ අනුමාතෘකා බැලීමට පහත ප්‍රධාන මාතෘකාවක් ටච් කරන්න",

        coursesQual: "පාඨමාලා සහ සුදුසුකම්",
        askAdvice: "උපදෙස් ලබාගන්න",

        installBody: "1. ඔබේ Browser එකේ ඉහළ ඇති තිත් 3 (⋮) හෝ Share බොත්තම ඔබන්න.<br><br>2. එහි ඇති <strong>\"Add to Home Screen\"</strong> හෝ <strong>\"Install App\"</strong> තෝරන්න.<br><br>3. දැන් ඔබේ දුරකථනයේ App Icon එකක් ලෙස මෙය ස්ථාපනය වේ!"
      }
    };

    function toggleLanguage() {
      currentLang = currentLang === "en" ? "si" : "en";
      localStorage.setItem("pt_lang", currentLang);
      refreshUI();
    }

    // =========================================================================
    // PERSISTENT STORAGE & PERMANENT PASSWORD PROTECTION
    // =========================================================================
    const STORAGE_KEY = "slaf_pt_fitness_system_v5";
    const PASS_LOCK_KEY = "slaf_pt_permanent_admin_pass";
    const FB_CONFIG_KEY = "slaf_pt_firebase_config";

    const DEFAULT_DATA = {
      siteTitle: "Physical Training and Fitness System",
      siteTitleSi: "ශාරීරික පුහුණු සහ යෝග්‍යතා පද්ධතිය",

      appIcon: DEFAULT_APP_ICON,
      creator: {
        name: "40218 Sgt Suranga",
        creatorPhoto: DEFAULT_AVATAR,
        profilePhoto: DEFAULT_AVATAR,

        visionEn: "To build a physically resilient, agile, and combat-ready force through scientific physical conditioning and modern athletic training standards.",
        visionSi: "විද්‍යාත්මක ශාරීරික පුහුණුව සහ නවීන ක්‍රීඩා ක්‍රමවේද තුළින් ශක්තිමත්, කාර්යක්ෂම සහ සටන් සූදානමින් යුත් පිරිසක් බිහිකිරීම.",

      } else {
        currentView = "subtopics";
      }
      refreshUI();
    }

    function openSubTopic(view, param = null) {
      currentView = view;
      selectedSubParam = param;
      refreshUI();
    }

    function t(enVal, siVal) {
      return currentLang === "si" && siVal ? siVal : enVal;
    }

    function refreshUI() {
      updatePwaIconsAndManifest();
      const ui = UI_TEXT[currentLang];
      const title = t(appData.siteTitle, appData.siteTitleSi);
      const subtitle = t(appData.siteSubtitle || "SLAF Athletic & Conditioning Portal", appData.siteSubtitleSi);

      document.getElementById("header-site-title").textContent = title;
      document.getElementById("header-subtitle").textContent = subtitle;
      document.getElementById("footer-title").textContent = title;
      document.title = title;

      document.getElementById("lang-btn-text").textContent = ui.langBtn;
      document.getElementById("creator-btn-label").textContent = ui.creatorBtn;
      document.getElementById("install-btn-label").textContent = ui.installBtn;
      document.getElementById("share-btn-label").textContent = ui.shareBtn;
      document.getElementById("home-back-label").textContent = ui.homeBack;
      document.getElementById("install-modal-heading").textContent = ui.installHeading;
      document.getElementById("install-modal-text").innerHTML = ui.installBody;

      const bcBar = document.getElementById("breadcrumb-bar");
      const bcTrail = document.getElementById("breadcrumb-trail");
      if (currentView === "home") {
        bcBar.classList.add("hidden");
      } else {
        bcBar.classList.remove("hidden");
        bcTrail.innerHTML = buildBreadcrumb();
      }

      const container = document.getElementById("app-container");
      if (currentView === "home") container.innerHTML = renderHome();
      else if (currentView === "subtopics") container.innerHTML = renderSubtopics();
      else if (currentView === "pti_list") container.innerHTML = renderPtiList();
      else if (currentView === "guide_detail") container.innerHTML = renderGuideDetail();
      else if (currentView === "calculators") container.innerHTML = renderCalculators();
      else if (currentView === "pft_system") container.innerHTML = renderPftSystem();
      else if (currentView === "leadership_view") container.innerHTML = renderLeadershipView();
      else if (currentView === "vision_view") container.innerHTML = renderVisionIdeasView();
      else if (currentView === "admin") container.innerHTML = renderAdminPanel();
    }

    function buildBreadcrumb() {
      let html = `<button onclick="goHome()" class="hover:text-white">${currentLang === "si" ? "මුල් පිටුව" : "Home"}</button>`;
      if (selectedMainTopic && currentView !== "admin") {
        const topicObj = appData.mainTopics.find(m => m.id === selectedMainTopic);
        const label = topicObj ? t(topicObj.titleEn, topicObj.titleSi) : selectedMainTopic;
        html += ` <span>/</span> <button onclick="openMainTopic('${selectedMainTopic}')" class="hover:text-white">${label}</button>`;
      }
      if (currentView === "admin") {
        html += ` <span>/</span> <span class="text-amber-400 font-semibold">Admin Panel</span>`;
      }
      return html;
    }

    function calcBMI() {
      const w = parseFloat(document.getElementById("bmi-weight").value);
      const h = parseFloat(document.getElementById("bmi-height").value) / 100;
      if (!w || !h) return;
      const bmi = (w / (h * h)).toFixed(1);
      let status = bmi < 18.5 ? "Underweight" : bmi < 25 ? "Normal / Fit" : bmi < 30 ? "Overweight" : "Obese";
      const res = document.getElementById("bmi-result");
      res.classList.remove("hidden");
      res.innerHTML = `<p class="text-2xl font-bold text-amber-400">${bmi}</p><p class="text-xs text-slate-300 mt-1">Status: <strong>${status}</strong></p>`;
    }

    function calcBodyFat() {
      const h = parseFloat(document.getElementById("bf-height").value);
      const n = parseFloat(document.getElementById("bf-neck").value);
      const w = parseFloat(document.getElementById("bf-waist").value);
      if (!h || !n || !w || w <= n) return;
      const bf = (495 / (1.0324 - 0.19077 * Math.log10(w - n) + 0.15456 * Math.log10(h)) - 450).toFixed(1);
      const res = document.getElementById("bf-result");
      res.classList.remove("hidden");
      res.innerHTML = `<p class="text-2xl font-bold text-amber-400">${bf}%</p><p class="text-xs text-slate-300 mt-1">Estimated Body Fat %</p>`;
    }

    function calcHR() {
      const age = parseInt(document.getElementById("hr-age").value);
      if (!age) return;
      const maxHr = Math.round(208 - 0.7 * age);
      const res = document.getElementById("hr-result");
      res.classList.remove("hidden");
      res.innerHTML = `
        <p class="text-sm font-bold text-white">Max Heart Rate: <span class="text-amber-400">${maxHr} bpm</span></p>
        <p class="text-emerald-400">• Fat Burn (65-75%): <strong>${Math.round(maxHr*0.65)} - ${Math.round(maxHr*0.75)} bpm</strong></p>
        <p class="text-sky-400">• Cardio Zone (75-85%): <strong>${Math.round(maxHr*0.75)} - ${Math.round(maxHr*0.85)} bpm</strong></p>
        <p class="text-rose-400">• Peak Zone (85-95%): <strong>${Math.round(maxHr*0.85)} - ${Math.round(maxHr*0.95)} bpm</strong></p>
      `;
    }

    function calcHydration() {
      const w = parseFloat(document.getElementById("hyd-weight").value);
      const m = parseFloat(document.getElementById("hyd-mins").value) || 0;
      if (!w) return;
      const liters = (w * 0.033 + (m / 30) * 0.35).toFixed(2);
      const cals = Math.round(w * 32 + m * 7);
      const res = document.getElementById("hyd-result");
      res.classList.remove("hidden");
      res.innerHTML = `
        <p class="text-sky-400 font-bold text-sm">Daily Water: ${liters} Liters</p>
        <p class="text-amber-400 font-bold text-sm">Daily Calories: ${cals} kcal</p>
      `;
    }

    function generatePftMarksheet() {
      const svc = document.getElementById("pft-svc").value.trim() || "N/A";
      const rankName = document.getElementById("pft-rank-name").value.trim() || "Candidate";
      const unit = document.getElementById("pft-unit").value.trim() || "SLAF";

      let totalObtained = 0;
      let totalPossible = 0;
      let allPassed = true;
      const rows = [];

      appData.pftEvents.forEach(ev => {
        const val = parseFloat(document.getElementById(`input-${ev.id}`).value);
        let score = 0;
        let passed = false;

        if (!isNaN(val)) {
          if (ev.type === "higher_better") {
            if (val >= ev.targetFull) score = ev.maxMarks;
            else if (val >= ev.minPass) score = Math.round(50 + ((val - ev.minPass) / (ev.targetFull - ev.minPass)) * (ev.maxMarks - 50));
            else score = Math.max(0, Math.round((val / ev.minPass) * 49));
            passed = val >= ev.minPass;
          } else {
            if (val <= ev.targetFull) score = ev.maxMarks;
            else if (val <= ev.minPass) score = Math.round(50 + ((ev.minPass - val) / (ev.minPass - ev.targetFull)) * (ev.maxMarks - 50));
            else score = Math.max(0, Math.round((ev.minPass / val) * 40));
            passed = val <= ev.minPass;
          }
        }
        if (!passed) allPassed = false;
        totalObtained += score;
        totalPossible += ev.maxMarks;
        rows.push({ name: t(ev.nameEn, ev.nameSi), raw: isNaN(val) ? "-" : val, score, max: ev.maxMarks, passed });
      });

      const pct = totalPossible ? ((totalObtained / totalPossible) * 100).toFixed(1) : 0;
      const grade = !allPassed ? "FAIL" : pct >= 85 ? "DISTINCTION (A)" : pct >= 70 ? "CREDIT (B)" : "PASS (C)";
      const today = new Date().toLocaleDateString();

      const out = document.getElementById("marksheet-output");
      out.classList.remove("hidden");
      out.innerHTML = `
        <div id="printable-marksheet" class="bg-white text-slate-900 rounded-2xl p-6 sm:p-8 shadow-2xl border border-slate-300">
          <div class="border-b-2 border-slate-900 pb-4 mb-4 flex items-center justify-between">
            <div>
              <h3 class="font-display text-xl font-bold uppercase text-slate-900">${appData.siteTitle}</h3>
              <p class="text-xs font-semibold text-slate-600 uppercase">Official Physical Fitness Test (PFT) Marksheet</p>
            </div>
            <div class="text-right text-xs text-slate-600">
              <p><strong>Date:</strong> ${today}</p>
              <p><strong>Result:</strong> <span class="${allPassed ? 'text-emerald-700' : 'text-red-700'} font-bold">${grade}</span></p>
            </div>
          </div>

          <div class="grid grid-cols-3 gap-2 bg-slate-100 p-3 rounded-lg text-xs mb-5">
            <div><span class="text-slate-500">Service No:</span> <strong>${svc}</strong></div>
            <div><span class="text-slate-500">Rank &amp; Name:</span> <strong>${rankName}</strong></div>
            <div><span class="text-slate-500">Unit / Base:</span> <strong>${unit}</strong></div>
          </div>

          <table class="w-full text-xs border-collapse mb-5">
            <thead>
              <tr class="bg-slate-900 text-white">
                <th class="p-2.5 text-left">Test Event</th>
                <th class="p-2.5 text-center">Performance</th>
                <th class="p-2.5 text-center">Marks</th>
                <th class="p-2.5 text-center">Status</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(r => `
                <tr class="border-b border-slate-200">
                  <td class="p-2.5 font-medium">${r.name}</td>
                  <td class="p-2.5 text-center">${r.raw}</td>
                  <td class="p-2.5 text-center font-bold">${r.score} / ${r.max}</td>
                  <td class="p-2.5 text-center font-bold ${r.passed ? 'text-emerald-700' : 'text-red-600'}">${r.passed ? 'PASS' : 'FAIL'}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>

          <div class="flex items-center justify-between bg-slate-100 p-4 rounded-xl text-sm">
            <div>
              <p class="text-xs text-slate-500">Total Score</p>
              <p class="font-bold text-lg text-slate-900">${totalObtained} / ${totalPossible} (${pct}%)</p>
            </div>
            <div class="text-right">
              <p class="text-xs text-slate-500">Final Grade</p>
              <p class="font-bold text-lg ${allPassed ? 'text-emerald-700' : 'text-red-700'}">${grade}</p>
            </div>
          </div>

          <div class="mt-6 pt-4 border-t border-slate-300 flex items-center justify-between text-[11px] text-slate-500">
            <span>System Creator: ${appData.creator.name}</span>
            <button onclick="window.print()" class="no-print bg-slate-900 hover:bg-slate-800 text-white font-semibold px-4 py-2 rounded-lg text-xs">
              Print / Save PDF Marksheet
            </button>
          </div>
        </div>
      `;
    }

      appData.trainingGuides[idx].titleEn = document.getElementById(`sg-ten-${idx}`).value.trim();
      appData.trainingGuides[idx].titleSi = document.getElementById(`sg-tsi-${idx}`).value.trim();
      appData.trainingGuides[idx].contentEn = document.getElementById(`sg-cen-${idx}`).value.trim();
      appData.trainingGuides[idx].contentSi = document.getElementById(`sg-csi-${idx}`).value.trim();
      saveData();
      alert("Sub-Topic Updated!");
    }

    function addNewSubTopic() {
      const topicId = document.getElementById("new-sg-topic").value || "guides";
      const categoryEn = document.getElementById("new-sg-caten").value.trim() || "Module";
      const categorySi = document.getElementById("new-sg-catsi").value.trim() || categoryEn;
      const titleEn = document.getElementById("new-sg-ten").value.trim();
      const titleSi = document.getElementById("new-sg-tsi").value.trim() || titleEn;
      const contentEn = document.getElementById("new-sg-cen").value.trim();
      const contentSi = document.getElementById("new-sg-csi").value.trim() || contentEn;
      if (!titleEn || !contentEn) return alert("Please enter Sub-Topic Title and Content.");
      appData.trainingGuides.push({
        id: "guide-" + Date.now(),
        topicId, categoryEn, categorySi, titleEn, titleSi,
        summaryEn: titleEn, summarySi: titleSi,
        contentEn, contentSi
      });
      saveData();
      alert("New Sub-Topic Added!");
    }

    function saveTopTwoOfficial(idx) {
      const name = document.getElementById(`top-name-${idx}`).value.trim();
      const whatsapp = document.getElementById(`top-wa-${idx}`).value.trim();
      const roleEn = document.getElementById(`top-ren-${idx}`).value.trim() || "Senior Official";
      const roleSi = document.getElementById(`top-rsi-${idx}`).value.trim() || roleEn;
      if (!name) return alert("Please enter Name & Rank.");
      appData.topTwoContacts[idx] = { id: `top-${idx+1}`, name, roleEn, roleSi, whatsapp, active: true };
      saveData();
      alert(`Official #${idx + 1} saved and activated!`);
    }

    function removeTopTwoOfficial(idx) {
      appData.topTwoContacts[idx] = { id: `top-${idx+1}`, name: "", roleEn: "", roleSi: "", whatsapp: "", active: false };
      saveData();
      alert(`Official #${idx + 1} removed!`);
    }

    function addDirectorMember() {
      const name = document.getElementById("new-dir-name").value.trim();
      const roleEn = document.getElementById("new-dir-ren").value.trim() || "Board Member";
      const roleSi = document.getElementById("new-dir-rsi").value.trim() || roleEn;
      const photoInput = document.getElementById("new-dir-photo");
      if (!name) return alert("Please enter Director Name.");

      const finalizeAdd = (photoUrl) => {
        appData.directors.push({ id: "dir-" + Date.now(), name, roleEn, roleSi, photo: photoUrl });
        saveData();
        alert("Board Member Added!");
      };

      if (photoInput.files && photoInput.files[0]) {
        compressImageFile(photoInput.files[0], 250, finalizeAdd);
      } else {
        finalizeAdd(DEFAULT_AVATAR);
      }
    }

    function updateDirectorPhoto(event, idx) {
      const file = event.target.files[0];
      if (!file) return;
      compressImageFile(file, 250, (dataUrl) => {
        appData.directors[idx].photo = dataUrl;
        saveData();
        alert("Director photo updated!");
      });
    }

    function saveGeneralSettings() {
      appData.siteTitle = document.getElementById("adm-site-title").value.trim() || "Physical Training and Fitness System";
      appData.siteTitleSi = document.getElementById("adm-site-title-si").value.trim() || "ශාරීරික පුහුණු සහ යෝග්‍යතා පද්ධතිය";
      appData.siteSubtitle = document.getElementById("adm-site-subtitle").value.trim();
      appData.siteSubtitleSi = document.getElementById("adm-site-subtitle-si").value.trim();
      appData.visionMission = {
        visionEn: document.getElementById("adm-vision-en").value.trim(),
        visionSi: document.getElementById("adm-vision-si").value.trim(),
        missionEn: document.getElementById("adm-mission-en").value.trim(),
        missionSi: document.getElementById("adm-mission-si").value.trim()
      };
      appData.creator.name = document.getElementById("adm-creator-name").value.trim() || "40218 Sgt Suranga";
      appData.creator.qualifications = document.getElementById("adm-creator-quals").value.split("\n").map(s => s.trim()).filter(Boolean);
      saveData();
      alert("General settings, Titles, and Vision/Mission saved!");
    }

    function handlePdfUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        appData.pftPdf = { fileName: file.name, dataUrl: e.target.result };
        saveData();
        alert("PFT PDF Uploaded!");
      };
      reader.readAsDataURL(file);
    }

    function addPftEvent() {
      const nameEn = document.getElementById("adm-ev-name-en").value.trim();
      const nameSi = document.getElementById("adm-ev-name-si").value.trim() || nameEn;
      const type = document.getElementById("adm-ev-type").value;
      const targetFull = parseFloat(document.getElementById("adm-ev-full").value);
      const minPass = parseFloat(document.getElementById("adm-ev-pass").value);
      const maxMarks = parseFloat(document.getElementById("adm-ev-max").value) || 100;
      if (!nameEn || isNaN(targetFull) || isNaN(minPass)) return alert("Please fill all event values.");
      appData.pftEvents.push({ id: "ev-" + Date.now(), nameEn, nameSi, type, targetFull, minPass, maxMarks });
      saveData();
    }

    function changeAdminPassword() {
      const curr = document.getElementById("adm-curr-pass").value.trim();
      const np = document.getElementById("adm-new-pass").value.trim();
      const conf = document.getElementById("adm-conf-pass").value.trim();

      if (curr !== permanentAdminPassword) return alert("Current password is incorrect!");
      if (np.length < 4) return alert("New password must be at least 4 characters.");
      if (np !== conf) return alert("New password and Confirm password do not match!");

      permanentAdminPassword = np;
      localStorage.setItem(PASS_LOCK_KEY, permanentAdminPassword);
      if (passRef) {
        passRef.set(permanentAdminPassword).catch(e => console.error("Password Firebase save error:", e));
      }
      document.getElementById("adm-curr-pass").value = "";
      document.getElementById("adm-new-pass").value = "";
      document.getElementById("adm-conf-pass").value = "";
      alert("Permanent Admin Password saved successfully!");
    }

    function saveFirebaseConfig() {
      try {
        const raw = document.getElementById("adm-fb-config").value.trim();
        savedFirebaseConfig = raw ? JSON.parse(raw) : null;
        localStorage.setItem(FB_CONFIG_KEY, JSON.stringify(savedFirebaseConfig));
        initFirebaseIfConfigured();
        if (dbRef) dbRef.set(appData);
        if (passRef) passRef.set(permanentAdminPassword);
        alert("Firebase connected and synced permanently!");
      } catch (e) {
        alert("Invalid JSON format. Please paste the exact Firebase config JSON.");
      }
    }

    // =========================================================================
    // MODALS (CREATOR & CONSULTATION)
    // =========================================================================
    function openCreatorModal() {
      const ui = UI_TEXT[currentLang];
      document.getElementById("modal-creator-badge").textContent = ui.creatorBtn;
      document.getElementById("modal-qual-heading").textContent = ui.coursesQual;
      document.getElementById("modal-creator-photo").src = appData.creator.creatorPhoto || DEFAULT_AVATAR;
      document.getElementById("modal-profile-photo").src = appData.creator.profilePhoto || DEFAULT_AVATAR;
      document.getElementById("modal-creator-name").textContent = appData.creator.name;
      document.getElementById("modal-qualifications-list").innerHTML = appData.creator.qualifications
        .map(q => `<li class="flex items-center gap-2"><span class="text-sky-400">✔</span><span>${q}</span></li>`).join("");
      document.getElementById("creator-modal").classList.remove("hidden");
    }

    function closeCreatorModal() {
      document.getElementById("creator-modal").classList.add("hidden");
    }

    function openConsultModal(ptiId) {
      activeConsultPti = appData.ptis.find(p => p.id === ptiId);
      if (!activeConsultPti) return;
      document.getElementById("consult-modal-title").textContent = UI_TEXT[currentLang].askAdvice;
      document.getElementById("consult-pti-target").textContent = `Instructor: ${activeConsultPti.name} (${activeConsultPti.category})`;
      document.getElementById("consult-modal").classList.remove("hidden");
    }

    function closeConsultModal() {
      document.getElementById("consult-modal").classList.add("hidden");
    }

    function sendWhatsAppConsultation() {
      if (!activeConsultPti) return;
      const sender = document.getElementById("consult-sender").value.trim() || "Trainee";
      const q = document.getElementById("consult-question").value.trim();
      if (!q) return alert("Please enter your question.");
      const text = encodeURIComponent(`*Physical Training & Fitness Inquiry*\nTo: ${activeConsultPti.name}\nFrom: ${sender}\n\nQuestion: ${q}`);
      window.open(`https://wa.me/${activeConsultPti.whatsapp}?text=${text}`, "_blank");
      closeConsultModal();
    }

    // Initialize App
    checkAdminUrl();
    initFirebaseIfConfigured();
    refreshUI();
  </script>
</body>
</html>
