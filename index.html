    function compressImageFile(file, maxSize, callback) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          let w = img.width;
          let h = img.height;
          if (w > h) {
            if (w > maxSize) { h = Math.round((h * maxSize) / w); w = maxSize; }
          } else {
            if (h > maxSize) { w = Math.round((w * maxSize) / h); h = maxSize; }
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          callback(canvas.toDataURL("image/png", 0.85));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

      document.getElementById("dynamic-favicon").href = iconSrc;

      if (manifestBlobUrl) URL.revokeObjectURL(manifestBlobUrl);
      const manifest = {
        name: appData.siteTitle || "Physical Training and Fitness System",

        start_url: window.location.href.split("#")[0].split("?")[0],
        display: "standalone",

        icons: [
          { src: iconSrc, sizes: "192x192", type: "image/png" },
          { src: iconSrc, sizes: "512x512", type: "image/png" }
        ]
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
      manifestBlobUrl = URL.createObjectURL(blob);
      let link = document.querySelector("link[rel='manifest']");
      if (!link) {
        link = document.createElement("link");
        link.rel = "manifest";
        document.head.appendChild(link);
      }
      link.href = manifestBlobUrl;
    }

    function createDefault10Bands(higherIsBetter, topVal, step) {
      const bands = [];
      for (let i = 0; i < 10; i++) {
        const marks = 12 - i > 0 ? 12 - i : 1;
        if (higherIsBetter) {
          const min = Math.max(1, topVal - i * step);
          const max = i === 0 ? 999 : topVal - (i - 1) * step - 1;
          bands.push({ min, max, marks });
        } else {
          const min = i === 0 ? 1 : topVal + (i - 1) * step + 1;
          const max = topVal + i * step;
          bands.push({ min, max, marks });
        }
      }
      return bands;
    }

    function initFirebaseIfConfigured() {

        try {

            firebase.initializeApp(savedFirebaseConfig);
          }
          dbRef = firebase.database().ref("pt_fitness_system_data");
          dbRef.on("value", (snapshot) => {
            const val = snapshot.val();
            if (val) {
              appData = { ...DEFAULT_DATA, ...val };
              if (!appData.camps) appData.camps = [...DEFAULT_26_CAMPS];
              if (!appData.ptiGallery) appData.ptiGallery = [];
              if (!appData.personalMessages) appData.personalMessages = [];
              if (!appData.newIdeas) appData.newIdeas = [];
              localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
              refreshUI();
            }
          });

          passRef = firebase.database().ref("pt_fitness_system_security/adminPassword");
          passRef.on("value", (snapshot) => {
            const remotePass = snapshot.val();
            if (remotePass && typeof remotePass === "string" && remotePass.trim().length > 0) {
              permanentAdminPassword = remotePass.trim();
              localStorage.setItem(PASS_LOCK_KEY, permanentAdminPassword);
            }
          });
        } catch (err) {
          console.error("Firebase init error:", err);
        }
      }
    }

    function calcBMI() {
      const w = parseFloat(document.getElementById("bmi-weight").value);
      const h = parseFloat(document.getElementById("bmi-height").value) / 100;
      if (!w || !h) return;
      const bmi = (w / (h * h)).toFixed(1);
      const res = document.getElementById("bmi-result");
      res.classList.remove("hidden");
      res.innerHTML = `<p class="text-xl font-bold text-amber-400">BMI: ${bmi}</p>`;
    }

    function calcBodyFat() {
      const h = parseFloat(document.getElementById("bf-height").value);
      const n = parseFloat(document.getElementById("bf-neck").value);
      const w = parseFloat(document.getElementById("bf-waist").value);
      if (!h || !n || !w || w <= n) return;
      const bf = (495 / (1.0324 - 0.19077 * Math.log10(w - n) + 0.15456 * Math.log10(h)) - 450).toFixed(1);
      const res = document.getElementById("bf-result");
      res.classList.remove("hidden");
      res.innerHTML = `<p class="text-xl font-bold text-amber-400">${bf}%</p>`;
    }

    function calcHR() {
      const age = parseInt(document.getElementById("hr-age").value);
      if (!age) return;
      const maxHr = Math.round(208 - 0.7 * age);
      const res = document.getElementById("hr-result");
      res.classList.remove("hidden");
      res.innerHTML = `<p>Max HR: <strong>${maxHr} bpm</strong></p><p class="text-emerald-400">Fat Burn: ${Math.round(maxHr*0.65)}-${Math.round(maxHr*0.75)} bpm</p><p class="text-sky-400">Cardio: ${Math.round(maxHr*0.75)}-${Math.round(maxHr*0.85)} bpm</p>`;
    }

    function calcHydration() {
      const w = parseFloat(document.getElementById("hyd-weight").value);
      const m = parseFloat(document.getElementById("hyd-mins").value) || 0;
      if (!w) return;
      const res = document.getElementById("hyd-result");

    function evaluateEvent10Bands(evId, ageCatId, rawVal) {
      if (isNaN(rawVal)) return { marks: 0, maxMarks: 12 };
      const bands = (appData.pftMatrix[evId] && appData.pftMatrix[evId][ageCatId]) || [];
      const maxMarks = bands.reduce((m, b) => Math.max(m, Number(b.marks) || 0), 0) || 12;
      for (const b of bands) {
        if (rawVal >= Number(b.min) && rawVal <= Number(b.max)) {
          return { marks: Number(b.marks) || 0, maxMarks };
        }
      }
      return { marks: 0, maxMarks };
    }

    function generatePftMarksheet() {
      const svc = document.getElementById("pft-svc").value.trim() || "N/A";
      const rankName = document.getElementById("pft-rank-name").value.trim() || "Candidate";
      const unit = document.getElementById("pft-unit").value;
      const ageCatId = document.getElementById("pft-age-cat").value;
      const ageObj = appData.pftAgeCategories.find(a => a.id === ageCatId);

      let totalObtained = 0;
      let totalPossible = 0;
      const rows = [];

      appData.pftEvents.forEach(ev => {
        const val = parseFloat(document.getElementById(`input-${ev.id}`).value);
        const { marks, maxMarks } = evaluateEvent10Bands(ev.id, ageCatId, val);
        totalObtained += marks;
        totalPossible += maxMarks;
        rows.push({ name: t(ev.nameEn, ev.nameSi), raw: isNaN(val) ? "-" : val, marks, maxMarks });
      });

      const pct = totalPossible ? ((totalObtained / totalPossible) * 100).toFixed(1) : 0;
      const out = document.getElementById("marksheet-output");
      out.classList.remove("hidden");
      out.innerHTML = `

            <div><span class="text-slate-500">Name:</span> <strong>${rankName}</strong></div>

          </div>

          <table class="w-full text-xs border-collapse mb-4">

                <th class="p-2 text-left">Event</th>
                <th class="p-2 text-center">Performance</th>
                <th class="p-2 text-center">Marks Obtained</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(r => `
                <tr class="border-b border-slate-200">
                  <td class="p-2 font-medium">${r.name}</td>
                  <td class="p-2 text-center">${r.raw}</td>
                  <td class="p-2 text-center font-bold">${r.marks} / ${r.maxMarks}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>

          <div class="flex items-center justify-between bg-slate-100 p-3.5 rounded-xl text-sm">
            <div><span class="text-xs text-slate-500 block">Total Score</span><strong>${totalObtained} / ${totalPossible} (${pct}%)</strong></div>

      if (curr !== permanentAdminPassword) return alert("Current password is incorrect!");

    function openConsultModal(ptiId) {
      activeConsultPti = appData.ptis.find(p => p.id === ptiId);
      if (!activeConsultPti) return;
      document.getElementById("consult-modal-title").textContent = UI_TEXT[currentLang].askAdvice;
      document.getElementById("consult-pti-target").textContent = `Instructor: ${activeConsultPti.rank || ''} ${activeConsultPti.name} (${activeConsultPti.camp})`;
      document.getElementById("consult-modal").classList.remove("hidden");
    }
    function closeConsultModal() { document.getElementById("consult-modal").classList.add("hidden"); }

    function sendWhatsAppConsultation() {
      if (!activeConsultPti) return;
      const sender = document.getElementById("consult-sender").value.trim() || "Trainee";
      const q = document.getElementById("consult-question").value.trim();
      if (!q) return alert("Please enter your question.");
      const text = encodeURIComponent(`*Physical Training & Fitness Inquiry*\nTo: ${activeConsultPti.rank || ''} ${activeConsultPti.name}\nFrom: ${sender}\n\nQuestion: ${q}`);
      window.open(`https://wa.me/${activeConsultPti.whatsapp}?text=${text}`, "_blank");
      closeConsultModal();
    }

    checkAdminUrl();
    initFirebaseIfConfigured();
    refreshUI();
  </script>
</body>
</html>
